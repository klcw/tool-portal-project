<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Essay Marker — Tool Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600&family=Nunito+Sans:wght@400;700&display=swap">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <a href="../index.html">&larr; Back to all tools</a>
    <button type="button" id="theme-toggle">Switch to dark theme</button>
  </header>

  <main>
    <h1>Essay Marker</h1>
    <p class="intro">Paste the essay question and your essay. You get a score out of 50 (Content out of 30, Language out of 20), with a reason for each part.</p>

    <form id="marker-form">
      <div class="field">
        <label for="question">Essay question</label>
        <textarea id="question" rows="3" placeholder="Paste the essay question here"></textarea>
      </div>
      <div class="field">
        <label for="essay">Your essay</label>
        <textarea id="essay" rows="16" placeholder="Paste your essay here"></textarea>
        <p id="word-count" class="note">0 words</p>
      </div>
      <div class="form-actions">
        <button type="submit" id="mark">Mark my essay</button>
        <button type="button" id="clear">Clear</button>
      </div>
    </form>

    <div id="results" aria-live="polite"></div>
  </main>

  <script src="../js/marker.js"></script>
</body>
</html>
