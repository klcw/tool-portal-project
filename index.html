<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tool Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600&family=Nunito+Sans:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <h1 class="site-title"><a href="index.html">Tool Portal</a></h1>
    <button type="button" id="theme-toggle">Switch to dark theme</button>
  </header>

  <main class="home">
    <h2>GP Paper 1 tools</h2>
    <p class="intro">Small web tools for GCE A Level General Paper, Paper 1 students. Pick a tool to try it.</p>

    <section class="tool-grid" aria-label="Tools">
      <article class="card">
        <div class="card-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg></div>
        <h3>Essay Marker</h3>
        <p>Paste an essay question and your essay to get a score out of 50, with reasons. AI marking is coming soon.</p>
        <a class="button" href="tools/marker.html">Open</a>
      </article>
    </section>
  </main>
</body>
</html>
